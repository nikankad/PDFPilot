<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDFPilot review</title><style>
:root{color-scheme:dark;font:15px system-ui;background:#10141d;color:#e8edf7}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;border-bottom:1px solid #2d394c;display:flex;gap:20px;align-items:center}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:calc(100vh - 68px)}iframe{width:100%;height:100%;border:0;background:#1f2736}aside{padding:24px;overflow:auto}input,textarea,button{font:inherit;border:1px solid #2d394c;border-radius:8px;padding:10px;color:inherit;background:#1f2736;width:100%;margin:5px 0}button{cursor:pointer;background:#415ee5}button:disabled{opacity:.5}label{display:block;margin-top:12px}input[type=checkbox]{width:auto}small{color:#99a7bd}.comment{padding:12px;border:1px solid #2d394c;border-radius:8px;margin:12px 0;white-space:pre-wrap}.error{color:#ff9797}a{color:#99aeff}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}iframe{height:70vh}}
</style><header><strong>PDFPilot</strong><h1 id="title">Shared review</h1><span id="status" role="status"></span></header><main><iframe id="pdf" title="Shared PDF document"></iframe><aside><p id="error" class="error" role="alert"></p><h2>Comments</h2><label>Name<input id="author" maxlength="200"></label><label>Page<input id="page" type="number" min="1" value="1"></label><label>Comment<textarea id="text" maxlength="10000"></textarea></label><button id="comment">Add comment</button><div id="comments"></div><section id="signing" hidden><h2>Signature request</h2><small>This is a typed electronic signature. Identity is based on possession of your private signing link. It is not a certificate signature.</small><label>Typed signature<input id="signature" maxlength="200"></label><label><input id="consent" type="checkbox">I agree to apply this typed signature to this document.</label><button id="sign">Sign document</button></section><h2>Signing status</h2><div id="recipients"></div><button id="download" hidden>Download completed PDF</button><h2>Activity</h2><div id="activity"></div></aside></main><script>
'use strict';const id=location.pathname.split('/').pop(),token=location.hash.slice(1),base='/api/reviews/'+id;let docURL;
const $=id=>document.getElementById(id);async function api(path='',body){const response=await fetch(base+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!response.ok){let error;try{error=(await response.json()).error}catch{error='Request failed'}throw Error(error)}return response}
function showError(error){$('error').textContent=error.message}async function refresh(){try{const data=await(await api()).json();$('title').textContent=data.title;$('page').max=data.pages;$('comments').replaceChildren();for(const c of data.comments){const item=document.createElement('div');item.className='comment';item.textContent=c.author+' · Page '+c.page+(c.resolved?' · Resolved':'')+'\n'+c.text;const reply=document.createElement('button');reply.textContent='Reply';reply.onclick=()=>{$('text').value='Reply to '+c.author+': ';$('text').focus()};item.append(reply);const resolve=document.createElement('button');resolve.textContent=c.resolved?'Reopen':'Resolve';resolve.onclick=async()=>{try{await api('/resolve',{comment_id:c.id,resolved:!c.resolved});await refresh()}catch(e){showError(e)}};item.append(resolve);$('comments').append(item)}$('recipients').replaceChildren();for(const r of data.recipients){const line=document.createElement('p');line.textContent=r.name+': '+(r.signed?'Signed':'Waiting');$('recipients').append(line)}const index=data.can_sign;const recipient=index===null?null:data.recipients[index];$('signing').hidden=!recipient||recipient.signed;const earlier=data.ordered&&index!==null&&data.recipients.slice(0,index).some(r=>!r.signed);$('sign').disabled=earlier;if(recipient)$('author').placeholder=recipient.name;$('download').hidden=!data.recipients.length||data.recipients.some(r=>!r.signed);$('status').textContent=data.recipients.length?data.recipients.filter(r=>r.signed).length+'/'+data.recipients.length+' signed':'Review';$('activity').replaceChildren();for(const e of data.events.slice(-15).reverse()){const p=document.createElement('p');p.textContent=e.kind+' · '+new Date(e.time*1000).toLocaleString();$('activity').append(p)}}catch(e){showError(e)}}
$('comment').onclick=async()=>{try{await api('/comments',{author:$('author').value,page:Number($('page').value),text:$('text').value});$('text').value='';$('error').textContent='';await refresh()}catch(e){showError(e)}};$('sign').onclick=async()=>{try{await api('/sign',{typed_name:$('signature').value,consent:$('consent').checked});$('error').textContent='';await refresh()}catch(e){showError(e)}};$('download').onclick=async()=>{try{const blob=await(await api('/completed.pdf')).blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='signed.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){showError(e)}};(async()=>{try{if(!token)throw Error('Open the complete private review link, including its token.');docURL=URL.createObjectURL(await(await api('/document.pdf')).blob());$('pdf').src=docURL;await refresh();setInterval(refresh,10000)}catch(e){showError(e)}})();
</script></html>
