[package]
name = "pdfpilot"
default-run = "pdfpilot"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "A native Rust PDF workspace"
license = "MIT"

[dependencies]
anyhow = "1.0"
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
lopdf = "=0.45.0"
rfd = "0.15"
rand = "0.9"
tempfile = "3.23"
serde_json = "1.0"
sha2 = "0.10.9"
base64 = "0.22"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSCell", "NSPasteboard"] }

[profile.release]
lto = "thin"
strip = true
